<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Usage Monitor</title>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main id="app">
    <header id="window-header" class="top">
      <span class="title">AI Usage</span>
      <span id="updated" class="muted"></span>
      <button id="compact-mode" class="icon-btn" type="button" title="Compact mode" aria-label="Compact mode" aria-pressed="false" disabled>
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <rect x="2" y="3" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M5 6h6M5 9h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="refresh" class="icon-btn" type="button" title="Refresh now" aria-label="Refresh now">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.61-3.89M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="close" class="icon-btn" type="button" title="Close window" aria-label="Close window">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="m4 4 8 8m0-8-8 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </header>
    <fieldset id="window-options" disabled aria-label="Window options">
      <label class="check" title="Keep the window open when you click elsewhere"><input type="checkbox" id="keep-open"> Keep open</label>
      <label class="check" title="Show the window above other apps"><input type="checkbox" id="always-on-top"> Always on top</label>
    </fieldset>
    <p id="settings-error" class="error" role="alert" hidden></p>
    <div id="providers"></div>

    <details id="auto-reset" class="card settings" hidden>
      <summary>
        <span class="card-name"><span class="chev" aria-hidden="true">▸</span> Codex auto-reset</span>
        <span id="auto-summary" class="plan">Off</span>
      </summary>
      <div class="setting">
        <label class="check"><input type="checkbox" id="weekly-enabled"> Use a reset when weekly usage reaches</label>
        <span class="num"><input type="number" id="weekly-percent" min="1" max="100" step="1" aria-label="Weekly usage percent">%</span>
      </div>
      <div class="setting sub">
        <span>…but not if the weekly limit resets on its own within</span>
        <span class="num"><input type="number" id="skip-hours" min="0" max="168" step="1" aria-label="Hours">h</span>
      </div>
      <div class="setting">
        <label class="check"><input type="checkbox" id="five-enabled"> Also when the 5-hour window blocks me for more than</label>
        <span class="num"><input type="number" id="five-minutes" min="0" max="300" step="5" aria-label="Minutes">min</span>
      </div>
      <p id="auto-status" class="note muted" hidden></p>
    </details>
  </main>
</body>
</html>
